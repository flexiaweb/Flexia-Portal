<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexia Portal - Panel Principal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="app-viewport">
    <!-- Fondo Abstracto General -->
    <div class="abstract-background-engine" aria-hidden="true">
      <div class="sky-gradient"></div>
      <div class="shape circle-large"></div>
      <div class="shape circle-medium"></div>
      <div class="shape orb-1"></div>
      <div class="shape orb-2"></div>
    </div>

    <div class="dashboard-layout">
      <!-- ÁREA CENTRAL (VENTANA COMPLETA) -->
      <main class="main-viewport">
        <div id="appHeaderContainer"></div>
        <!-- NAVEGACIÓN DE RUTA -->
        <div style="margin-bottom: 1.5rem;">
            <a href="./dashboard.html" class="btn-back-link" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--accent-primary); font-weight: 600; font-size: 0.9rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Volver al Dashboard
            </a>
        </div>

        <!-- MODULO AQUI -->
        <section class="logs-module-container">
            
            <!-- Contenedor Único Estilizado (Tarjeta Principal) -->
            <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03); display: flex; flex-direction: column; gap: 1.25rem;">
                
                <!-- Cabecera del Módulo (Dentro de la tarjeta) -->
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-color);">
                    <div>
                        <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.2rem; letter-spacing: -0.02em;">Registro del Sistema</h1>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">Flujo de eventos en tiempo real de la organización.</p>
                    </div>
                    
                    <!-- Buscador rápido y botones en línea -->
                    <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                        <input type="text" id="inputBuscarLog" placeholder="Filtrar eventos..." class="form-control-styled" style="width: 260px; padding: 0.5rem 0.85rem; font-size: 0.875rem;">
                        <button type="button" id="btnDescargarLogs" class="btn-secondary" style="padding: 0.5rem 0.9rem;" title="Descargar lista en TXT">
                            Descargar TXT
                        </button>
                        <button type="button" id="btnActualizarLogs" class="btn-secondary" style="padding: 0.5rem 0.9rem;" title="Recargar">
                            Actualizar
                        </button>
                    </div>
                </div>

                <!-- Lista de Logs tipo Texto Plano -->
                <div id="listaLogsConsola" style="display: flex; flex-direction: column; font-size: 0.8rem; min-height: 380px; max-height: 60vh; overflow-y: auto; padding-right: 0.5rem;">
                    <div style="color: var(--text-muted); text-align: center; padding: 2rem; font-family: var(--font-family);">Cargando registros...</div>
                </div>
                
                <!-- Controles de Paginación -->
                <div id="paginacionContainer" style="display: flex; justify-content: space-between; align-items: center; padding-top: 0.5rem; border-top: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.75rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <button type="button" id="btnPaginaAnterior" class="btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" disabled>Anterior</button>
                        <button type="button" id="btnPaginaSiguiente" class="btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" disabled>Siguiente</button>
                    </div>
                    <span id="paginaActualText" style="color: var(--text-secondary); font-size: 0.825rem;">Página 1 de 1</span>
                </div>

                <!-- Pie / Contador -->
                <div style="padding-top: 0.25rem; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.8rem;">
                    <span id="contadorLogsText">Mostrando registros</span>
                    <span>Modo texto plano</span>
                </div>

            </div>
        </section>            
      </main>
    </div>
  </div>

  <script type="module" src="../js/auth-check.js"></script>
  <script type="module" src="../js/user-manager.js"></script>
  <script type="module" src="../js/logs-loader.js"></script> 
</body>
</html>
