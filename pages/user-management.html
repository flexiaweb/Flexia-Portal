<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexia Portal - Gestión de Cuentas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="app-viewport">
    <!-- Fondo Abstracto General -->
    <div class="abstract-background-engine" aria-hidden="true">
      <div class="sky-gradient"></div>
      <div class="shape circle-large"></div>
      <div class="shape circle-medium"></div>
      <div class="shape orb-1"></div>
      <div class="shape orb-2"></div>
    </div>

    <div class="dashboard-layout">
      <!-- ÁREA CENTRAL (VENTANA COMPLETA) -->
      <main class="main-viewport">
        <div id="appHeaderContainer"></div>
        
        <!-- NAVEGACIÓN DE RUTA -->
        <div style="margin-bottom: 1.5rem;">
            <a href="./dashboard.html" class="btn-back-link" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--accent-primary); font-weight: 600; font-size: 0.9rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Volver al Dashboard
            </a>
        </div>

        <!-- MÓDULO: GESTIÓN DE CUENTAS / ACCESOS -->
        <section class="content-card" style="padding: 1.75rem; background: var(--bg-card, #ffffff); border-radius: 1rem; box-shadow: var(--shadow-sm, 0 4px 6px -1px rgba(0,0,0,0.1));">
          
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
              <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary, #0f172a); margin-bottom: 0.25rem;">Gestión de Cuentas y Accesos</h2>
              <p style="font-size: 0.9rem; color: var(--text-secondary, #64748b);">Administra los usuarios autorizados para operar en tu organización.</p>
            </div>
          </div>

          <!-- TABLA DE USUARIOS MIEMBROS -->
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.925rem;">
              <thead>
                <tr style="border-bottom: 2px solid var(--border-color, #e2e8f0); color: var(--text-secondary, #64748b);">
                  <th style="padding: 0.75rem 0.5rem; font-weight: 600;">Correo Electrónico</th>
                  <th style="padding: 0.75rem 0.5rem; font-weight: 600;">Nombre / Rol</th>
                  <th style="padding: 0.75rem 0.5rem; font-weight: 600;">Estado de Vínculo</th>
                  <th style="padding: 0.75rem 0.5rem; font-weight: 600; text-align: right;">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaUsersMembersBody">
                <!-- Se rellena dinámicamente -->
              </tbody>
            </table>
          </div>

        </section>

      </main>
    </div>
  </div>

  <script type="module" src="../js/auth-check.js"></script>
  <script type="module" src="../js/user-manager.js"></script>
  <script type="module" src="../js/user-management-loader.js"></script>
</body>
</html>
